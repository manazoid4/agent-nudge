name: format adoption branch

on:
  push:
    branches:
      - agent/v05-adoption-foundation

permissions:
  contents: write

concurrency:
  group: format-adoption-branch
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/v05-adoption-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Remove unused imports and normalise browser scroll option
        run: |
          sed -i '/^  Copy,$/d' src/ui/App.tsx
          sed -i '/^  Github,$/d' src/ui/App.tsx
          sed -i 's/behavior: "instant"/behavior: "auto"/' src/ui/App.tsx

      - name: Format with repository toolchain
        run: npm run format

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md SECURITY.md docs index.html public src
          git commit -m "style: format adoption foundation"
          git push origin HEAD:agent/v05-adoption-foundation
