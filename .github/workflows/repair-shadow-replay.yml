name: capture Shadow Replay diagnostics

on:
  pull_request:
    types: [reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shadow-replay-worktrees
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture strict TypeScript diagnostics
        run: npm run typecheck > docs/shadow-replay-typecheck.txt 2>&1 || true
      - name: Commit diagnostics to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/shadow-replay-typecheck.txt
          git commit -m "chore: capture Shadow Replay typecheck diagnostics"
          git push origin HEAD:agent/shadow-replay-worktrees
