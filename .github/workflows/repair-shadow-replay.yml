name: repair Shadow Replay strict typing

on:
  pull_request:
    types: [synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shadow-replay-worktrees
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply strict array bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/core/shadow-mode.ts')
          text = path.read_text()
          text = text.replace('? sorted[middle]\n    : (sorted[middle - 1] + sorted[middle]) / 2;', '? sorted[middle]!\n    : (sorted[middle - 1]! + sorted[middle]!) / 2;')
          path.write_text(text)
          Path('docs/shadow-replay-typecheck.txt').unlink(missing_ok=True)
          PY
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - name: Commit strict typing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/shadow-mode.ts
          git add -u docs/shadow-replay-typecheck.txt
          git commit -m "fix: satisfy strict Shadow Replay bounds"
          git push origin HEAD:agent/shadow-replay-worktrees
