name: format OpenCode lifecycle branch

on:
  push:
    branches:
      - agent/opencode-lifecycle-evidence

permissions:
  contents: write

concurrency:
  group: format-opencode-lifecycle
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opencode-lifecycle-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: format OpenCode lifecycle evidence"
          git push origin HEAD:agent/opencode-lifecycle-evidence
