name: apply OpenCode bridge refactor

on:
  push:
    branches:
      - agent/opencode-full-event-bridge

permissions:
  contents: write

concurrency:
  group: apply-opencode-bridge
  cancel-in-progress: true

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply OpenCode bridge refactor') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opencode-full-event-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Move generator into connector module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/cli/index.ts')
          text = path.read_text()
          marker = '} from "../connectors/index.js";\n'
          replacement = marker + 'import { buildOpenCodePlugin } from "../connectors/opencode-plugin.js";\n'
          if 'buildOpenCodePlugin' not in text:
              text = text.replace(marker, replacement, 1)
          text = text.replace('pluginContent: openCodePlugin(args("opencode")),', 'pluginContent: buildOpenCodePlugin(args("opencode")),')
          text, count = re.subn(r'\nfunction openCodePlugin\(hookArgs: string\[\]\) \{.*?\n\}\n\nasync function exportData', '\nasync function exportData', text, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one old generator, found {count}')
          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run format
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "refactor: apply OpenCode bridge refactor"
          git push origin HEAD:agent/opencode-full-event-bridge
