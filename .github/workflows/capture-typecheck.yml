name: capture typecheck diagnostics

on:
  push:
    branches:
      - agent/opencode-lifecycle-evidence

permissions:
  contents: write

concurrency:
  group: capture-typecheck-diagnostics
  cancel-in-progress: true

jobs:
  capture:
    if: ${{ !contains(github.event.head_commit.message, 'capture typecheck diagnostics') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opencode-lifecycle-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture diagnostics
        run: npm run typecheck > typecheck-errors.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck-errors.txt
          git commit -m "chore: capture typecheck diagnostics"
          git push origin HEAD:agent/opencode-lifecycle-evidence
