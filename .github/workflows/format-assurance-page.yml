name: format assurance page

on:
  push:
    branches:
      - agent/assurance-live-page

permissions:
  contents: write

concurrency:
  group: format-assurance-page
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/assurance-live-page

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format with repository toolchain
        run: npm run format

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public src
          git commit -m "style: format assurance page"
          git push origin HEAD:agent/assurance-live-page
